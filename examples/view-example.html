<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Brag document</title>
<style>
/* ===== Tokens ===================================================== */
:root {
  --paper: #F8F7F4;
  --surface: #FFFFFF;
  --sunk: #EFEDE8;
  --ink: #141413;
  --ink-2: #4F4D48;
  --ink-3: #69665F;
  --line: #E4E1D9;
  --line-2: #D3CFC5;
  --pink: oklch(0.925 0.045 12);
  --lilac: oklch(0.925 0.045 295);
  --L-mesh: 0.93; --C-mesh: 0.065;
  --L-hi: 0.975; --L-lo: 0.86;
  --chip-L: 0.93; --chip-C: 0.05; --chip-ink-L: 0.38;
  --frost: rgb(255 255 255 / 0.52);
  --frost-line: rgb(255 255 255 / 0.75);
  --shadow: 0 1px 2px rgb(20 20 19 / 0.04), 0 8px 24px -12px rgb(20 20 19 / 0.12);
  --shadow-lg: 0 24px 64px -24px rgb(20 20 19 / 0.35);
  --r-xl: 28px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --font: "Inter Display", "Inter", "Segoe UI Variable Display", "SF Pro Display", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --gutter: clamp(16px, 4vw, 40px);
  --max: 1180px;
}
@media screen and (prefers-color-scheme: dark) {
  :root {
    --paper: #12120F;
    --surface: #1B1A17;
    --sunk: #23221E;
    --ink: #F3F1EC;
    --ink-2: #C9C5BC;
    --ink-3: #A9A49A;
    --line: #2E2C27;
    --line-2: #3D3A34;
    --pink: oklch(0.32 0.05 12);
    --lilac: oklch(0.32 0.05 295);
    --L-mesh: 0.4; --C-mesh: 0.095;
    --L-hi: 0.49; --L-lo: 0.31;
    --chip-L: 0.33; --chip-C: 0.06; --chip-ink-L: 0.9;
    --frost: rgb(255 255 255 / 0.07);
    --frost-line: rgb(255 255 255 / 0.12);
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px -12px rgb(0 0 0 / 0.6);
    --shadow-lg: 0 24px 64px -24px rgb(0 0 0 / 0.8);
  }
}

/* ===== Base ======================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--line-2) transparent; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.55 var(--font); font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased; caret-color: var(--ink);
  overflow-x: hidden;
}
::selection { background: oklch(0.88 0.09 165); color: #141413; }
h1, h2, h3, p, ul, ol { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
.icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

/* ===== Buttons, chips ============================================= */
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px;
  border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
  font-weight: 550; font-size: 15px; letter-spacing: -0.005em; white-space: nowrap;
  transition: transform .2s var(--ease-out), background .2s;
}
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 14px; }
.chip {
  --h: 165;
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px;
  background: oklch(var(--chip-L) var(--chip-C) var(--h)); color: oklch(var(--chip-ink-L) 0.08 var(--h));
  font-size: 13px; font-weight: 550; white-space: nowrap; border: 1px solid transparent;
}
.chip::before { content: "#"; opacity: .6; font-weight: 500; }
.badge-draft {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px;
  border: 1px dashed var(--line-2); color: var(--ink-2); font-size: 13px; font-weight: 500;
}
.badge-draft .icon { width: 14px; height: 14px; }

/* ===== Top bar ==================================================== */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -0.02em; font-size: 17px; }
.brand svg { width: 26px; height: 26px; }
.top-meta { color: var(--ink-3); font-size: 14px; text-align: right; }

/* ===== Hero ======================================================= */
.hero { text-align: center; padding-block: clamp(40px, 9vw, 104px) clamp(40px, 6vw, 72px); }
.eyebrow { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); }
.hero h1 {
  margin: 18px auto 0; max-width: 14ch; text-wrap: balance;
  font-size: clamp(2.7rem, 8.4vw, 5.8rem); line-height: 0.98; letter-spacing: -0.04em; font-weight: 640;
}
.hero h1 span { display: block; }
.hero-sub { margin: 22px auto 0; max-width: 52ch; color: var(--ink-2); font-size: clamp(16px, 2vw, 18px); text-wrap: pretty; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 30px; }

/* ===== Section heads ============================================== */
.sec { padding-block: clamp(28px, 5vw, 56px); }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; margin-bottom: 22px; }
.sec-head h2 { font-size: clamp(1.6rem, 3.2vw, 2.3rem); letter-spacing: -0.03em; line-height: 1.1; font-weight: 640; }
.sec-head p { color: var(--ink-3); font-size: 15px; max-width: 48ch; }

/* ===== Highlight cards (mesh + folder tab) ======================== */
.hl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.hl {
  --h: 165; --R: 22px;
  position: relative; display: flex; flex-direction: column; gap: 22px; min-height: 380px;
  padding: 30px 30px 26px; border-radius: var(--r-xl); border: 1px solid var(--line);
  color: var(--ink);
  background:
    radial-gradient(110% 85% at 0% 0%, oklch(var(--L-hi) 0.03 calc(var(--h) - 30)) 0%, transparent 58%),
    radial-gradient(90% 80% at 100% 100%, oklch(var(--L-lo) calc(var(--C-mesh) + 0.04) calc(var(--h) + 22)) 0%, transparent 62%),
    radial-gradient(70% 60% at 82% 18%, oklch(calc(var(--L-mesh) - 0.02) var(--C-mesh) calc(var(--h) - 12)) 0%, transparent 66%),
    radial-gradient(60% 70% at 15% 100%, oklch(var(--L-mesh) var(--C-mesh) calc(var(--h) + 50)) 0%, transparent 72%),
    oklch(var(--L-mesh) var(--C-mesh) var(--h));
  transition: transform .35s var(--ease-out), box-shadow .35s var(--ease-out);
}
.hl:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.hl:focus-within { box-shadow: var(--shadow); }
.hl-tab {
  position: absolute; top: -1px; right: -1px; padding: 12px 18px 12px 20px;
  background: var(--paper); border: 1px solid var(--line); border-top: 0; border-right: 0;
  border-bottom-left-radius: var(--R);
  font-size: 13px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
}
.hl-tab::before, .hl-tab::after {
  content: ""; position: absolute; width: var(--R); height: var(--R); pointer-events: none;
  background: radial-gradient(circle at 0 100%, transparent calc(var(--R) - 1px), var(--line) calc(var(--R) - 0.5px), var(--line) var(--R), var(--paper) calc(var(--R) + 0.5px));
}
.hl-tab::before { top: 0; left: calc(var(--R) * -1 + 0px); }
.hl-tab::after { top: 100%; right: 0; }
.hl-tags { display: flex; flex-wrap: wrap; gap: 6px; padding-right: 120px; min-height: 26px; }
.hl .chip { background: var(--frost); color: oklch(var(--chip-ink-L) 0.08 var(--h)); }
.hl-text { font-size: clamp(18px, 1.9vw, 21px); line-height: 1.42; letter-spacing: -0.012em; color: var(--ink-2); max-width: 40ch; }
.hl-text strong { color: var(--ink); font-weight: 650; }
.stretch { all: unset; cursor: pointer; }
.stretch::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-xl); }
.stretch:focus-visible::after { outline: 2px solid var(--ink); outline-offset: 3px; }
.hl-panels { margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel {
  display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 150px; padding: 18px 18px 16px;
  border-radius: var(--r-lg); background: var(--frost); border: 1px solid var(--frost-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
}
.panel.wide { grid-column: 1 / -1; min-height: 0; }
.panel-num { font-size: clamp(30px, 3.6vw, 44px); font-weight: 650; letter-spacing: -0.04em; line-height: 1; color: var(--ink); overflow-wrap: anywhere; }
.panel-cap { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.panel .icon { width: 22px; height: 22px; color: var(--ink-2); }
.panel-quote { font-size: 16px; line-height: 1.45; color: var(--ink); }

/* ===== Stat cards ================================================= */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
.stat {
  display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 196px;
  padding: 20px 20px 18px; border-radius: var(--r-lg); background: var(--sunk); border: 1px solid transparent;
}
.stat:nth-child(1) { background: var(--pink); }
.stat:nth-child(2) { background: var(--surface); border-color: var(--line); }
.stat:nth-child(3) { background: var(--lilac); }
.stat-label { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.stat-num { font-size: clamp(40px, 5vw, 60px); font-weight: 650; letter-spacing: -0.045em; line-height: 1; }
.stat-cap { margin-top: 8px; font-size: 14px; color: var(--ink-2); line-height: 1.4; }

/* ===== Explore: tabs + filters ==================================== */
.tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--sunk); }
.tab { border: 0; background: transparent; min-height: 38px; padding: 0 18px; border-radius: 999px; font-weight: 550; font-size: 15px; color: var(--ink-2); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .08); }
.filters {
  display: grid; gap: 16px; margin: 20px 0 28px; padding: 18px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line);
}
.f-row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
.field { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--paper); }
.field:focus-within { border-color: var(--ink); outline: 2px solid var(--ink); outline-offset: 2px; }
.field input { border: 0; outline: 0; background: transparent; min-width: 0; padding: 0; }
.field input::placeholder { color: var(--ink-3); }
.f-search { flex: 1 1 260px; }
.f-search input { width: 100%; }
.field label { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.field input[type="date"] { font-variant-numeric: tabular-nums; color-scheme: light dark; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 34px; padding: 0 14px; border-radius: 999px; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tagf { display: flex; flex-wrap: wrap; gap: 8px; }
.tagf .chip { height: 34px; padding: 0 12px; font-size: 14px; border-color: transparent; transition: border-color .15s; }
.tagf .chip .icon { width: 14px; height: 14px; display: none; stroke-width: 2.2; }
.tagf .chip[aria-pressed="true"] { border-color: currentColor; }
.tagf .chip[aria-pressed="true"]::before { display: none; }
.tagf .chip[aria-pressed="true"] .icon { display: block; }
.f-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-3); }
.f-count { color: var(--ink); font-weight: 600; }
.linkbtn { border: 0; background: none; padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); font-weight: 550; }
.linkbtn:disabled { opacity: .4; cursor: default; text-decoration: none; }

/* ===== Timeline =================================================== */
.month { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; padding-block: 20px; border-top: 1px solid var(--line); }
.month-head { position: sticky; top: 16px; align-self: start; }
.month-name { font-size: 22px; font-weight: 640; letter-spacing: -0.025em; }
.month-count { color: var(--ink-3); font-size: 14px; }
.month.gap { padding-block: 14px; }
.month.gap .month-name { font-size: 17px; color: var(--ink-3); font-weight: 550; }
.gap-line { align-self: center; display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 14px; }
.gap-line::before { content: ""; width: 48px; border-top: 1px dashed var(--line-2); }
.cards { display: grid; gap: 12px; }
.card {
  --h: 165;
  position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 18px;
  padding: 20px 22px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line);
  transition: border-color .2s, box-shadow .25s var(--ease-out), transform .25s var(--ease-out);
}
.card:hover { border-color: var(--line-2); box-shadow: var(--shadow); transform: translateY(-1px); }
.card .stretch::after { border-radius: var(--r-lg); }
.card-date { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60px; border-radius: var(--r-md); background: oklch(var(--chip-L) var(--chip-C) var(--h)); color: oklch(var(--chip-ink-L) 0.08 var(--h)); }
.card-day { font-size: 24px; font-weight: 650; letter-spacing: -0.03em; line-height: 1; }
.card-wd { font-size: 12px; font-weight: 550; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }
.card-title { font-size: 18px; font-weight: 620; letter-spacing: -0.015em; line-height: 1.3; text-wrap: balance; }
.card-desc { margin-top: 4px; color: var(--ink-2); font-size: 15px; max-width: 68ch; }
.card-impact { margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; font-size: 15px; max-width: 68ch; }
.card-impact .icon { margin-top: 3px; color: oklch(0.55 0.12 var(--h)); }
.card-impact strong { font-weight: 680; }
.card-impact.none { color: var(--ink-3); font-style: italic; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; align-items: center; }
.card.draft { background: transparent; border-style: dashed; }
.card.draft .card-date { background: transparent; border: 1px dashed var(--line-2); color: var(--ink-2); }
.card.draft .card-title { color: var(--ink-2); }
.empty-filter { padding: 48px 20px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: var(--r-lg); }
.empty-filter p + p { margin-top: 12px; }

/* ===== Graph ====================================================== */
.graph-wrap { position: relative; border-radius: var(--r-xl); border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
.graph-wrap svg { display: block; width: 100%; touch-action: manipulation; }
.g-edge { stroke: var(--line-2); stroke-width: 1; transition: opacity .2s; }
.g-link { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-dasharray: 5 4; transition: opacity .2s; }
.g-node { cursor: pointer; transition: opacity .2s; }
.g-node:focus { outline: none; }
.g-node:focus-visible .g-ring { stroke: var(--ink); stroke-width: 2.5; }
.g-ring { fill: none; stroke: transparent; }
.g-hub rect { stroke-width: 1; }
.g-hub text { font-size: 13px; font-weight: 600; }
.g-label { font-size: 12.5px; font-weight: 550; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; pointer-events: none; opacity: 0; transition: opacity .15s; }
svg.labels .g-label { opacity: 1; }
svg.focus .g-node.on .g-label, .g-node:hover .g-label, .g-node:focus-visible .g-label { opacity: 1; }
svg.focus .g-node:not(.on), svg.focus .g-edge:not(.on), svg.focus .g-link:not(.on) { opacity: 0.14; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 14px 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend svg { width: 34px; height: 12px; }

/* ===== Drawer ===================================================== */
dialog.drawer {
  margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(560px, 100vw); max-width: 100vw;
  padding: 0; border: 0; border-left: 1px solid var(--line); background: var(--paper); color: var(--ink);
  box-shadow: var(--shadow-lg); overflow: auto; overscroll-behavior: contain;
}
dialog.drawer[open] { animation: slide-in .45s var(--ease-out); }
dialog.drawer::backdrop { background: rgb(20 20 19 / 0.32); }
@keyframes slide-in { from { transform: translateX(32px); opacity: 0; } }
.d-bar { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px 14px 28px; background: var(--paper); border-bottom: 1px solid var(--line); }
.d-bar .date { color: var(--ink-2); font-size: 14px; }
.iconbtn { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; }
.iconbtn:hover { border-color: var(--ink); }
.d-body { padding: 28px 28px 48px; display: grid; gap: 28px; }
.d-title { font-size: clamp(26px, 4vw, 32px); line-height: 1.12; letter-spacing: -0.03em; font-weight: 650; text-wrap: balance; }
.d-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.d-desc { margin-top: 12px; font-size: 17px; color: var(--ink-2); }
.d-impact {
  --h: 165; padding: 20px; border-radius: var(--r-lg);
  background: radial-gradient(90% 120% at 100% 100%, oklch(var(--L-lo) var(--C-mesh) calc(var(--h) + 22)) 0%, transparent 70%), oklch(var(--L-mesh) var(--C-mesh) var(--h));
}
.d-impact p { font-size: 18px; line-height: 1.45; letter-spacing: -0.01em; }
.d-sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); font-weight: 650; margin-bottom: 10px; }
.d-impact h3 { color: var(--ink); opacity: .75; }
.md { display: grid; gap: 10px; font-size: 16px; max-width: 65ch; }
.md ul, .md ol { padding-left: 22px; display: grid; gap: 4px; }
.md code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .9em; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
.src { list-style: none; padding: 0; display: grid; gap: 8px; }
.src li { padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.src a, .src .src-t { font-weight: 560; display: inline-flex; gap: 6px; align-items: baseline; }
.src a .icon { width: 14px; height: 14px; transform: translateY(2px); }
.src-m { font-size: 14px; color: var(--ink-3); margin-top: 2px; }
.rel { display: grid; gap: 8px; }
.rel button { text-align: left; display: grid; gap: 2px; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.rel button:hover { border-color: var(--ink); }
.rel small { color: var(--ink-3); font-size: 13px; }

/* ===== Footer, empty state, present button ======================== */
.foot { padding-block: 48px 64px; color: var(--ink-3); font-size: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.foot .icon { width: 16px; height: 16px; }
.empty-page { min-height: 100vh; display: grid; place-items: center; padding: var(--gutter); }
.empty-card { --h: 165; position: relative; max-width: 560px; padding: 40px; text-align: left; border-radius: var(--r-xl); border: 1px solid var(--line);
  background: radial-gradient(90% 90% at 100% 0%, oklch(var(--L-lo) var(--C-mesh) 190) 0%, transparent 65%), radial-gradient(80% 80% at 0% 100%, oklch(var(--L-mesh) var(--C-mesh) 110) 0%, transparent 70%), oklch(var(--L-mesh) var(--C-mesh) 150); }
.empty-card h1 { font-size: clamp(30px, 6vw, 44px); letter-spacing: -0.035em; line-height: 1.05; font-weight: 650; margin-bottom: 14px; }
.empty-card p { color: var(--ink-2); font-size: 17px; }

/* ===== Safe Markdown subset → DOM nodes (never innerHTML) ========= */

}
